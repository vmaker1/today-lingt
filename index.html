<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#202A44" />
    <meta name="description" content="오늘의 빛 — 매일의 신앙 훈련 컴패니언" />
    <title>오늘의 빛</title>

    <!-- 서버에 미리 연결해 두기 (첫 요청이 빨라져요) -->
    <link rel="preconnect" href="https://pykyqwhhopmmgidqtamw.supabase.co" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- 글꼴: 앱 코드보다 먼저, 실제 쓰는 굵기만 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" />

    <style>
      /* 앱이 뜨기 전 잠깐 보이는 첫 화면 (흰 화면 대신) */
      body { margin: 0; background: #e9e4d8; }
      #splash { min-height: 100vh; display: flex; justify-content: center; }
      #splash > div {
        width: 100%; max-width: 400px; min-height: 100vh; background: #FAF7F0;
        box-shadow: 0 0 60px rgba(32,42,68,.15);
      }
      #splash .top {
        background: linear-gradient(165deg, #202A44 0%, #2C3A63 60%, #504B77 100%);
        height: 190px; display: flex; align-items: center; justify-content: center;
        color: #FBECC6; font-family: 'Gowun Batang', serif; font-size: 22px; letter-spacing: 2px;
      }
      #splash .dot { animation: sp 1.4s ease infinite; }
      @keyframes sp { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash"><div><div class="top"><span class="dot">✦ 오늘의 빛</span></div></div></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
